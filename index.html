<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0d" />

    <!--
      TODO before launch — replace every "yourdomain.com", "Business Name",
      phone number and social link below with your real details.
    -->
    <title>Business Name | Mobile Bartender in Sunnyside, WA</title>
    <meta name="description" content="Business Name is a premier mobile bartending service based in Sunnyside, Washington. We bring the bar to your wedding, corporate event, or private party across the Yakima Valley." />
    <link rel="canonical" href="https://www.yourdomain.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Business Name" />
    <meta property="og:url" content="https://www.yourdomain.com/" />
    <meta property="og:title" content="Business Name | Mobile Bartender — Sunnyside, WA" />
    <meta property="og:description" content="Premier mobile bartending service in Sunnyside, Washington. We bring the bar to you." />
    <!-- TODO: host your own 1200x630 image (e.g. /public/og-image.jpg) and use its full https URL -->
    <meta property="og:image" content="https://images.pexels.com/photos/5097033/pexels-photo-5097033.jpeg?auto=compress&cs=tinysrgb&h=650&w=940" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://images.pexels.com/photos/5097033/pexels-photo-5097033.jpeg?auto=compress&cs=tinysrgb&h=650&w=940" />

    <!-- Structured data for Google local search. TODO: update with your real details. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Business Name",
        "description": "Mobile bartending for weddings, corporate events, and private parties in Sunnyside and the greater Yakima Valley, Washington.",
        "url": "https://www.yourdomain.com/",
        "telephone": "+15095550100",
        "email": "hello@yourdomain.com",
        "image": "https://www.yourdomain.com/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sunnyside",
          "addressRegion": "WA",
          "addressCountry": "US"
        },
        "areaServed": ["Sunnyside, WA", "Yakima Valley, WA"],
        "sameAs": ["https://instagram.com", "https://facebook.com"]
      }
    </script>

    <!-- Google Fonts: Cormorant Garamond (headings) and Inter (body). Update tailwind.config.js too if you change these. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;color:#e2e2e6;background:#0a0a0d">

      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
